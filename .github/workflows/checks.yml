name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tools:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral tests
        run: python -B -m unittest discover -s tests -v
      - name: Fictional feedback loop
        run: python -B tools/demo.py
      - name: Example registry
        run: python -B tools/check_knowledge.py examples/feedback-loop
      - name: Prepared text checks
        run: python -B tools/audit_public.py .
